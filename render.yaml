# Render Blueprint Specification for Mystery Hub
# Configures the Render Static Site with proper SPA rewrite routing:
# All frontend routes (/*) are internally rewritten to /index.html with HTTP 200.
# No HTTP 301/302 redirects to /index.html.
services:
  - type: web
    name: mystery-hub
    runtime: static
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      # The app landing page has its own HTML so link previews (WhatsApp, Facebook, X) show the app's title and
      # image. It must come before the catch-all. The page itself is the same SPA.
      - type: rewrite
        source: /app
        destination: /app/index.html
      - type: rewrite
        source: /app/
        destination: /app/index.html
      - type: rewrite
        source: /*
        destination: /index.html
