name: Database security
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify PostgreSQL TLS enforcement and compatibility rollout
        run: node --import tsx scripts/runTests.ts server/suppliers/__tests__/databaseTls.test.ts
      - name: Create isolated non-superuser owner and API roles
        env:
          PGPASSWORD: local-test-only
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE app_owner LOGIN PASSWORD 'local-owner-only' NOSUPERUSER NOBYPASSRLS; CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS; GRANT anon,authenticated TO app_owner;"
          createdb -h 127.0.0.1 -U postgres -O app_owner mystery_routing_test
          createdb -h 127.0.0.1 -U postgres -O app_owner mystery_contact_test
          createdb -h 127.0.0.1 -U postgres -O app_owner mystery_sms_test
          createdb -h 127.0.0.1 -U postgres -O app_owner mystery_sms_experience_test
          createdb -h 127.0.0.1 -U postgres -O app_owner mystery_sms_studio_test
          createdb -h 127.0.0.1 -U postgres -O app_owner mystery_sms_v2_test
          createdb -h 127.0.0.1 -U postgres -O app_owner mystery_rls_test
          createdb -h 127.0.0.1 -U postgres -O app_owner mystery_monitor_test
          createdb -h 127.0.0.1 -U postgres -O app_owner mystery_admin_website_test
          createdb -h 127.0.0.1 -U postgres -O app_owner mystery_finance_reconciliation_test
          createdb -h 127.0.0.1 -U postgres -O app_owner mystery_finance_lookup_test
          createdb -h 127.0.0.1 -U postgres -O app_owner mystery_efficiency_test
          createdb -h 127.0.0.1 -U postgres -O app_owner mystery_shield_test
          createdb -h 127.0.0.1 -U postgres -O app_owner mystery_creative_test
          createdb -h 127.0.0.1 -U postgres -O app_owner mystery_experiences_test
          createdb -h 127.0.0.1 -U postgres -O app_owner mystery_checkers_test
          createdb -h 127.0.0.1 -U postgres -O app_owner mystery_admin_alerts_test
          createdb -h 127.0.0.1 -U postgres -O app_owner mystery_campaign_test
          createdb -h 127.0.0.1 -U postgres -O app_owner mystery_afa_pricing_test
          createdb -h 127.0.0.1 -U postgres -O app_owner mystery_service_control_test
      - name: Verify RLS, client denial and backend compatibility
        env:
          MYSTERY_RLS_POSTGRES_URL: postgresql://app_owner:local-owner-only@127.0.0.1:5432/mystery_rls_test
        run: node --import tsx --test server/suppliers/__tests__/backendRlsPostgres.test.ts
      - name: Verify checkout monitor durability and financial isolation
        env:
          MYSTERY_MONITOR_POSTGRES_URL: postgresql://app_owner:local-owner-only@127.0.0.1:5432/mystery_monitor_test
        run: node --import tsx --test server/suppliers/__tests__/salesReliabilityPostgres.test.ts
      - name: Verify Admin website projections and query accuracy
        env:
          MYSTERY_ADMIN_WEBSITE_POSTGRES_URL: postgresql://app_owner:local-owner-only@127.0.0.1:5432/mystery_admin_website_test
        run: node --import tsx --test server/suppliers/__tests__/adminWebsitePostgres.test.ts
      - name: Verify read-only financial reconciliation evidence and isolation
        env:
          MYSTERY_FINANCE_RECONCILIATION_POSTGRES_URL: postgresql://app_owner:local-owner-only@127.0.0.1:5432/mystery_finance_reconciliation_test
        run: node --import tsx --test server/suppliers/__tests__/financeReconciliationPostgres.test.ts

      - name: Verify bounded finance lookup and unchanged idempotent effects
        env:
          MYSTERY_FINANCE_LOOKUP_POSTGRES_URL: postgresql://app_owner:local-owner-only@127.0.0.1:5432/mystery_finance_lookup_test
        run: NODE_ENV=test node --import tsx --test server/suppliers/__tests__/financeLookup.test.ts

      - name: Verify dormant Shield schema and claim isolation
        env:
          MYSTERY_SHIELD_POSTGRES_URL: postgresql://app_owner:local-owner-only@127.0.0.1:5432/mystery_shield_test
        run: node --import tsx --test server/suppliers/__tests__/mysteryShield.test.ts server/suppliers/__tests__/mysteryShieldPostgres.test.ts

      - name: Verify Creative Studio briefs in PostgreSQL
        env:
          MYSTERY_CREATIVE_POSTGRES_URL: postgresql://app_owner:local-owner-only@127.0.0.1:5432/mystery_creative_test
        run: node --import tsx --test --test-force-exit server/suppliers/__tests__/creativeStudioPostgres.test.ts

      - name: Verify private Admin alerts against PostgreSQL
        env:
          MYSTERY_ADMIN_ALERTS_POSTGRES_URL: postgresql://app_owner:local-owner-only@127.0.0.1:5432/mystery_admin_alerts_test
        run: node --import tsx --test server/suppliers/__tests__/adminCommandCentrePostgres.test.ts

      - name: Verify Results Checkers in PostgreSQL
        env:
          MYSTERY_CHECKERS_POSTGRES_URL: postgresql://app_owner:local-owner-only@127.0.0.1:5432/mystery_checkers_test
        run: node --import tsx --test --test-force-exit server/suppliers/__tests__/resultsCheckersPostgres.test.ts

      - name: Verify order supplier namespace and webhook isolation
        env:
          MYSTERY_ROUTING_POSTGRES_URL: postgresql://app_owner:local-owner-only@127.0.0.1:5432/mystery_routing_test
        run: node --import tsx --test server/suppliers/__tests__/supplierRouting.test.ts server/suppliers/__tests__/supplierRoutingPostgres.test.ts

      - name: Verify December campaign pricing, welcome reservation and snapshot in PostgreSQL
        env:
          MYSTERY_CAMPAIGN_POSTGRES_URL: postgresql://app_owner:local-owner-only@127.0.0.1:5432/mystery_campaign_test
        run: node --import tsx --test server/suppliers/__tests__/decemberCampaignPostgres.test.ts

      - name: Verify Service Control Center concurrent saves and atomic audit in PostgreSQL
        env:
          MYSTERY_SERVICE_CONTROL_POSTGRES_URL: postgresql://app_owner:local-owner-only@127.0.0.1:5432/mystery_service_control_test
        run: node --import tsx --test --test-force-exit server/suppliers/__tests__/serviceControlPostgres.test.ts

      - name: Verify AFA pricing quote, Wallet debit and snapshot in PostgreSQL
        env:
          MYSTERY_AFA_PRICING_POSTGRES_URL: postgresql://app_owner:local-owner-only@127.0.0.1:5432/mystery_afa_pricing_test
        run: node --import tsx --test --test-force-exit server/suppliers/__tests__/afaCommercialPostgres.test.ts

      - name: Verify dormant seasonal controls and private anonymous greetings
        env:
          MYSTERY_EXPERIENCES_POSTGRES_URL: postgresql://app_owner:local-owner-only@127.0.0.1:5432/mystery_experiences_test
        run: node --import tsx --test --test-force-exit server/suppliers/__tests__/mysteryExperiencesPostgres.test.ts

      - name: Verify Customer Contact Hub identity, full exports and private audit in PostgreSQL
        env:
          MYSTERY_CONTACT_POSTGRES_URL: postgresql://app_owner:local-owner-only@127.0.0.1:5432/mystery_contact_test
        run: node --import tsx --test server/suppliers/__tests__/contactHubPostgres.test.ts

      - name: Verify dormant SMS schema, paid-send crash windows and signed-report isolation
        env:
          MYSTERY_SMS_POSTGRES_URL: postgresql://app_owner:local-owner-only@127.0.0.1:5432/mystery_sms_test
        run: node --import tsx --test server/suppliers/__tests__/smsPostgres.test.ts

      - name: Verify SMS V2 permission provenance, channel notices and report fairness
        env:
          MYSTERY_SMS_V2_POSTGRES_URL: postgresql://app_owner:local-owner-only@127.0.0.1:5432/mystery_sms_v2_test
        run: node --import tsx --test server/suppliers/__tests__/smsPermissionsV2.test.ts

      - name: Verify SMS V2 transactional experience and new-order policy
        env:
          MYSTERY_SMS_EXPERIENCE_POSTGRES_URL: postgresql://app_owner:local-owner-only@127.0.0.1:5432/mystery_sms_experience_test
        run: node --import tsx --test server/suppliers/__tests__/smsExperienceV2Postgres.test.ts server/suppliers/__tests__/smsProviderDiagnostics.test.ts

      - name: Verify SMS studio audience evidence and versioned manual templates
        env:
          MYSTERY_SMS_STUDIO_POSTGRES_URL: postgresql://app_owner:local-owner-only@127.0.0.1:5432/mystery_sms_studio_test
        run: node --import tsx --test server/suppliers/__tests__/smsStudio.test.ts server/suppliers/__tests__/smsStudioPostgres.test.ts

      - name: Verify bounded recovery, idle notification reads and report parity
        env:
          MYSTERY_EFFICIENCY_POSTGRES_URL: postgresql://app_owner:local-owner-only@127.0.0.1:5432/mystery_efficiency_test
        run: NODE_ENV=test node --import tsx --test server/suppliers/__tests__/databaseEfficiencyPostgres.test.ts

      - name: Verify managed data checkout isolation and PostgreSQL concurrency
        env:
          PGPASSWORD: local-test-only
          MYSTERY_V51_POSTGRES_URL: postgresql://app_owner:local-owner-only@127.0.0.1:5432/mystery_managed_store_test
        run: |
          createdb -h 127.0.0.1 -U postgres -O app_owner mystery_managed_store_test
          node --import tsx scripts/runTests.ts server/suppliers/__tests__/{paymentIsolation,websiteBusinessV1,websiteV51Postgres}.test.ts

      - name: Rehearse the full standby restore and reverse migration with PostgreSQL 17
        env:
          MYSTERY_PORTABILITY_POSTGRES_URL: postgresql://app_owner:local-owner-only@127.0.0.1:5432/mh_source_test
          PGPASSWORD: local-test-only
          TMPDIR: /tmp
        run: |
          for db in mh_source_test mh_target_test mh_reverse_test mh_blocked_test mh_failed_test; do
            createdb -h 127.0.0.1 -U postgres -O app_owner "$db"
          done
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE mh_locale_test OWNER app_owner TEMPLATE template0 ENCODING 'UTF8' LOCALE_PROVIDER icu ICU_LOCALE 'en-US'"
          tools="$(mktemp -d)"
          cat > "$tools/pgtool" <<'SH'
          #!/usr/bin/env bash
          set -eu
          exec docker run --rm --network host --user "$(id -u):$(id -g)" -v /tmp:/tmp \
            -e PGAPPNAME -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD -e PGCONNECT_TIMEOUT -e PGSSLMODE \
            --entrypoint "/usr/lib/postgresql/17/bin/${0##*/}" postgres:17 "$@"
          SH
          chmod 700 "$tools/pgtool"
          for tool in pg_dump pg_restore psql; do ln -s pgtool "$tools/$tool"; done
          PATH="$tools:$PATH" node --import tsx scripts/runTests.ts server/suppliers/__tests__/databaseStandby.test.ts
